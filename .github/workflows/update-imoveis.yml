name: Atualizar lista de imóveis

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# So precisa de escrever no repositorio. A publicacao e feita pelo proprio
# GitHub Pages, configurado em Settings > Pages como "Deploy from a branch"
# (main / root): qualquer commit neste repositorio publica o site.
# Nao ha workflow de deploy, logo nao ha grupo de concorrencia nem corridas.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download CSV da Google Sheet
        run: |
          curl -sL "https://docs.google.com/spreadsheets/d/1DQhWdXrLv_iilAvck9W1cJXeUIwNhQuiuu5WPpefT8c/export?format=csv&gid=320533870" -o properties.csv

      - name: Gerar HTML
        run: |
          python3 << 'EOF'
          import csv, html, os, re, shutil
          from datetime import datetime, timezone, timedelta

          rows = []
          with open("properties.csv", "r", encoding="utf-8") as f:
              for row in csv.DictReader(f):
                  if (row.get("Reference") or "").strip():
                      rows.append(row)

          now = datetime.now(timezone(timedelta(hours=1))).strftime("%Y-%m-%d %H:%M")

          CSS = ("body{font-family:Arial,sans-serif;margin:20px;max-width:820px}"
                 "h1{color:#2c3e50}h2{color:#2c3e50;font-size:1.15em}"
                 ".update{color:#7f8c8d;font-size:.9em;margin-bottom:20px}"
                 ".property{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:5px}"
                 ".property h2{margin:0 0 8px;font-size:1.1em}"
                 ".property p{margin:4px 0;color:#555}"
                 ".ref{font-weight:bold;color:#e67e22}"
                 ".price{font-weight:bold;color:#27ae60;font-size:1.1em}a{color:#2980b9}")

          # pasta limpa para as paginas individuais
          if os.path.isdir("imoveis"):
              shutil.rmtree("imoveis")
          os.makedirs("imoveis", exist_ok=True)

          def clean_price(p):
              p = (p or "").strip()
              if not p:
                  return "Sob consulta"
              return p if "€" in p else p + " €"

          def clean_local(loc):
              # "Aljustrel > Aljustrel" -> "Aljustrel"; "A > B" -> "B (concelho de A)"
              parts = [x.strip() for x in (loc or "").split(">") if x.strip()]
              if not parts:
                  return ""
              if len(parts) == 1 or parts[0] == parts[-1] or parts[0] in parts[-1]:
                  return parts[-1]
              return f"{parts[-1]}, concelho de {parts[0]}"

          def extrai_area(title):
              # A area vive no titulo do imovel, escrito a mao. So se extrai quando
              # o padrao e inequivoco; caso contrario fica vazio, para o bot dizer
              # que nao tem a informacao em vez de inventar um numero.
              t = title or ""
              m = re.search(r"(\d{1,4}(?:[.,]\d{1,2})?)\s*(?:ha\b|hectares?\b)", t, re.I)
              if m:
                  return m.group(1).replace(".", ",") + " ha"
              m = re.search(r"(\d{1,3}(?:[.\s]?\d{3})*|\d+)\s*(?:m2\b|m\u00b2)", t, re.I)
              if m:
                  return m.group(1).replace(" ", ".") + " m\u00b2"
              return ""

          def extrai_tipologia(title):
              m = re.search(r"\bT\s?(\d)(\s*\+\s*(\d))?\b", title or "", re.I)
              if not m:
                  return ""
              return "T%s+%s" % (m.group(1), m.group(3)) if m.group(3) else "T" + m.group(1)

          # Freguesia/localidade -> concelho. A folha so traz a localidade em muitas linhas,
          # e sem concelho nem regiao a pesquisa por zona ("Costa Alentejana", "perto de
          # Sines") nao encontra nada. Localidade nova sem mapa fica com o concelho vazio.
          CONCELHOS = {
              "santiago do cacém": "Santiago do Cacém",
              "santiago do cacém, s.cruz e s.bartolomeu da serra": "Santiago do Cacém",
              "são francisco da serra": "Santiago do Cacém", "são domingos e vale de água": "Santiago do Cacém",
              "vale de água": "Santiago do Cacém", "cercal": "Santiago do Cacém", "abela": "Santiago do Cacém",
              "santo andré": "Santiago do Cacém", "sines": "Sines", "porto covo": "Sines",
              "são luís": "Odemira", "são teotónio": "Odemira", "colos": "Odemira",
              "vila nova de milfontes": "Odemira", "odemira": "Odemira",
              "grândola e santa margarida da serra": "Grândola", "grândola": "Grândola",
              "ourique": "Ourique", "aljustrel": "Aljustrel", "messejana": "Aljustrel",
              "santa cruz": "Almodôvar", "almodôvar": "Almodôvar",
              "mexilhoeira grande": "Portimão", "portimão": "Portimão",
          }
          LITORAL = "Alentejo Litoral (Costa Alentejana)"
          REGIOES = {
              "Santiago do Cacém": LITORAL, "Sines": LITORAL, "Odemira": LITORAL, "Grândola": LITORAL,
              "Aljustrel": "Baixo Alentejo (interior)", "Ourique": "Baixo Alentejo (interior)",
              "Almodôvar": "Baixo Alentejo (interior)", "Portimão": "Algarve",
          }

          def concelho_regiao(loc):
              parts = [x.strip() for x in (loc or "").split(">") if x.strip()]
              if not parts:
                  return "", ""
              conc = CONCELHOS.get(parts[0].lower(), "") if len(parts) > 1 else ""
              conc = conc or CONCELHOS.get(parts[-1].lower(), "")
              return conc, REGIOES.get(conc, "")

          def preco_num(p):
              d = re.sub(r"\D", "", p or "")
              return int(d) if d else None

          def slugify(t):
              t = t.lower()
              for a, b in (("áàâã", "a"), ("éê", "e"), ("í", "i"), ("óôõ", "o"), ("ú", "u"), ("ç", "c")):
                  for ch in a:
                      t = t.replace(ch, b)
              return re.sub(r"[^a-z0-9]+", "-", t).strip("-")

          catalogo = []

          index_cards = []

          for r in rows:
              ref = (r.get("Reference") or "").strip()
              title = (r.get("Title") or "").strip()
              local = clean_local(r.get("Location"))
              price = clean_price(r.get("Price"))
              tipo = (r.get("Type") or "").strip()
              url = (r.get("URL") or "").strip()
              area = extrai_area(title)
              tipol = extrai_tipologia(title)
              conc, reg = concelho_regiao(r.get("Location"))

              slug = re.sub(r"[^A-Za-z0-9-]", "", ref) or "sem-ref"
              tail = ref.split("-")[-1].strip()        # PT03Q-0706 -> 0706 ; PT03I-0682A -> 0682A
              digits = re.sub(r"\D", "", tail)         # 0706
              short = digits.lstrip("0") or digits     # 706

              # variantes de escrita da referencia, sem repeticoes
              variantes, _vistos = [], set()
              for v in (ref, f"ref {ref}", f"referencia {ref}", tail, f"ref {tail}",
                        digits, f"ref {digits}", f"ref. {short}", f"código {ref}", f"imóvel {ref}"):
                  if v and v not in _vistos:
                      _vistos.add(v)
                      variantes.append(v)

              e = html.escape
              extras = []
              if area:
                  extras.append(f"\u00c1rea: {e(area)}")
              if tipol:
                  extras.append(f"Tipologia: {e(tipol)}")
              if conc:
                  extras.append(f"Concelho: {e(conc)}")
              if reg:
                  extras.append(f"Região: {e(reg)}")
              linha_extras = ("<p>" + " \u00b7 ".join(extras) + "</p>") if extras else ""
              # A referencia aparece no title, no h1 e em varias formas no corpo.
              # E o que torna o codigo recuperavel pela pesquisa da knowledge base.
              # A ficha e um REDIRECCIONADOR permanente: a referencia e o URL.
              # O bot nao precisa de procurar nada, so de compor .../imoveis/<REF>.html
              redirect = ""  # NAO repor: o rastreador do GHL seguia-o e indexava o anuncio, nao a ficha
              destino = (f'<p>Link:</p>'
                         f'<p><a href="{e(url)}">{e(url)}</a></p>') if url else (
                         f'<p>O anúncio da referência {e(ref)} não está disponível online neste momento.</p>'
                         f'<p>Contacte a Stop And Buy: (+351) 269 633 106</p>')

              page = f"""<!DOCTYPE html>
          <html lang="pt"><head><meta charset="UTF-8">
          {redirect}
          <title>{e(ref)} - {e(title)} | Stop And Buy</title>
          <meta name="description" content="Imóvel Stop And Buy com a referência {e(ref)}: {e(title)}, {e(local)}. Preço {e(price)}.">
          <style>{CSS}</style>
          </head><body>
          <h1>{e(ref)} - {e(title)}</h1>
          <p>Referência: <span class="ref">{e(ref)}</span> · {e(local)} · <span class="price">{e(price)}</span> · {e(tipo)}</p>
          {linha_extras}
          {destino}
          <hr>
          <p><a href="../index.html">Todos os imóveis Stop And Buy</a></p>
          </body></html>"""

              with open(os.path.join("imoveis", slug + ".html"), "w", encoding="utf-8") as f:
                  f.write(page)

              catalogo.append(dict(ref=ref, title=title, local=local, price=price, num=preco_num(price),
                                   url=url, conc=conc, reg=reg, extras=" · ".join(extras)))

              index_cards.append(
                  f'<div class="property"><h2><a href="imoveis/{e(slug)}.html">{e(ref)} - {e(title)}</a></h2>'
                  f'<p>Ref: <span class="ref">{e(ref)}</span></p>'
                  f'<p>Local: {e(local)}</p>'
                  f'<p>Preço: <span class="price">{e(price)}</span></p>'
                  f'<p>Tipo: {e(tipo)}</p>'
                  + linha_extras +
                  f'<p>Link: <a href="{e(url)}">{e(url)}</a></p>'
                  f'<p>Ficha completa da referência {e(ref)}: '
                  f'<a href="imoveis/{e(slug)}.html">imoveis/{e(slug)}.html</a></p></div>'
              )

          index = f"""<!DOCTYPE html>
          <html lang="pt"><head><meta charset="UTF-8">
          <title>Stop And Buy - Imóveis Disponíveis</title>
          <style>{CSS}</style>
          </head><body>
          <h1>Stop And Buy - Imóveis Disponíveis</h1>
          <p class="update">Atualizado: {now} | Total: {len(rows)} imóveis</p>
          <p>Cada imóvel tem uma ficha própria, acessível pela sua referência.</p>
          {''.join(index_cards)}
          </body></html>"""

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(index)
          # Paginas de PESQUISA por orcamento e por concelho. A pesquisa da knowledge base
          # e por semelhanca e devolve 5 blocos: uma pergunta "300 a 350 mil na Costa
          # Alentejana" nunca encontra as fichas certas uma a uma. Uma pagina pequena por
          # faixa de preco e por concelho da ao bot a lista inteira que responde ao criterio.
          # Faixas SOBREPOSTAS de proposito: um orcamento perto do limite cai em duas.
          if os.path.isdir("pesquisa"):
              shutil.rmtree("pesquisa")
          os.makedirs("pesquisa", exist_ok=True)
          FAIXAS = [(0, 150000), (100000, 250000), (200000, 350000), (300000, 450000),
                    (400000, 600000), (550000, 1000000), (900000, None)]

          def eur(n):
              return f"{n:,}".replace(",", ".") + " €"

          def linha(c):
              base = f"{c['ref']} — {c['title']} · {c['local']} · {c['price']}"
              if c["extras"]:
                  base += " · " + c["extras"]
              return base + (f" · Link: {c['url']}" if c["url"] else " · sem anúncio online")

          def pagina(nome, titulo, intro, itens):
              e = html.escape
              lis = "".join(f"<li>{e(linha(c))}</li>" for c in itens)
              corpo = (f"<ul>{lis}</ul>" if itens else "<p>Neste momento não há imóveis nesta pesquisa.</p>")
              doc = f"""<!DOCTYPE html>
          <html lang="pt"><head><meta charset="UTF-8">
          <title>{e(titulo)} | Stop And Buy</title>
          <style>{CSS}</style>
          </head><body>
          <h1>{e(titulo)}</h1>
          <p>{e(intro)} Total: {len(itens)} imóveis. Atualizado: {now}.</p>
          {corpo}
          <p><a href="../index.html">Todos os imóveis Stop And Buy</a></p>
          </body></html>"""
              with open(os.path.join("pesquisa", nome), "w", encoding="utf-8") as f:
                  f.write(doc)
              return "pesquisa/" + nome

          com_preco = sorted([c for c in catalogo if c["num"]], key=lambda c: c["num"])
          paginas = []
          for lo, hi in FAIXAS:
              itens = [c for c in com_preco if c["num"] >= lo and (hi is None or c["num"] <= hi)]
              if hi is None:
                  titulo = f"Imóveis à venda acima de {eur(lo)}"
                  intro = f"Imóveis da Stop And Buy para um orçamento acima de {lo // 1000} mil euros, do mais barato para o mais caro."
                  nome = f"preco-acima-de-{lo}.html"
              else:
                  titulo = f"Imóveis à venda entre {eur(lo)} e {eur(hi)}"
                  intro = (f"Imóveis da Stop And Buy para um orçamento entre {lo // 1000} mil e {hi // 1000} mil euros, "
                           f"do mais barato para o mais caro.")
                  nome = f"preco-{lo}-{hi}.html"
              paginas.append(pagina(nome, titulo, intro, itens))

          por_conc = {}
          for c in com_preco:
              if c["conc"]:
                  por_conc.setdefault(c["conc"], []).append(c)
          for conc, itens in sorted(por_conc.items()):
              reg = REGIOES.get(conc, "")
              titulo = f"Imóveis à venda no concelho de {conc}" + (f" — {reg}" if reg else "")
              intro = f"Todos os imóveis da Stop And Buy no concelho de {conc}, do mais barato para o mais caro."
              paginas.append(pagina(f"concelho-{slugify(conc)}.html", titulo, intro, itens))

          litoral = [c for c in com_preco if c["reg"] == LITORAL]
          paginas.append(pagina("regiao-alentejo-litoral.html",
                                f"Imóveis à venda no {LITORAL}",
                                "Imóveis da Stop And Buy nos concelhos de Sines, Santiago do Cacém, Odemira e Grândola "
                                "(Porto Covo, Vila Nova de Milfontes, Santo André, Cercal, São Luís, São Teotónio), "
                                "do mais barato para o mais caro.", litoral))

          # sitemap.xml: e o que permite ao rastreador do GHL descobrir sozinho as
          # fichas individuais. Sem ele o rastreador so treina a pagina que lhe
          # derem, e um imovel novo fica invisivel para a knowledge base.
          BASE = "https://mab-cm-sketch.github.io/ptm-imoveis-kb/"
          hoje = datetime.now(timezone(timedelta(hours=1))).strftime("%Y-%m-%d")
          urls = [BASE] + [f"{BASE}imoveis/{re.sub(r'[^A-Za-z0-9-]', '', (r.get('Reference') or '').strip()) or 'sem-ref'}.html" for r in rows] + [BASE + p for p in paginas]
          linhas = [f"  <url><loc>{html.escape(u)}</loc><lastmod>{hoje}</lastmod></url>" for u in urls]
          sitemap = chr(10).join(['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'] + linhas + ['</urlset>', ''])
          with open("sitemap.xml", "w", encoding="utf-8") as f:
              f.write(sitemap)

          # 404: uma referencia que nao exista aterra aqui, em vez de dar erro cru
          nao_encontrado = f"""<!DOCTYPE html>
          <html lang="pt"><head><meta charset="UTF-8">
          <title>Referência não encontrada | Stop And Buy</title>
          <style>{CSS}</style>
          </head><body>
          <h1>Referência não encontrada</h1>
          <p>Não encontrámos nenhum imóvel com essa referência na lista da Stop And Buy.
          Pode ter havido um erro no código, ou o imóvel pode ter saído do mercado.</p>
          <p>Contacte-nos: (+351) 269 633 106 · <a href="https://www.stopandbuy.pt">stopandbuy.pt</a></p>
          <p><a href="/ptm-imoveis-kb/index.html">Ver todos os imóveis disponíveis</a></p>
          </body></html>"""
          with open("404.html", "w", encoding="utf-8") as f:
              f.write(nao_encontrado)

          print(f"Gerado index.html + 404.html + {len(rows)} fichas em imoveis/ + {len(paginas)} paginas em pesquisa/")
          EOF

      - name: Commit e push
        id: commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A index.html 404.html imoveis pesquisa sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update imóveis $(date '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
