name: Atualizar lista de imóveis

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# So precisa de escrever no repositorio. A publicacao e feita pelo proprio
# GitHub Pages, configurado em Settings > Pages como "Deploy from a branch"
# (main / root): qualquer commit neste repositorio publica o site.
# Nao ha workflow de deploy, logo nao ha grupo de concorrencia nem corridas.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 30/10/2026: a lista passa a vir do proprio site (www.stopandbuy.pt). A folha
      # patrimonius_properties fica como BACKUP: e escrita a partir desta leitura (Make)
      # e so e usada se a leitura do site falhar ou vier fraca (travoes em base_dados).
      - name: Download CSV da Google Sheet (backup)
        run: |
          curl -sL "https://docs.google.com/spreadsheets/d/1DQhWdXrLv_iilAvck9W1cJXeUIwNhQuiuu5WPpefT8c/export?format=csv&gid=320533870" -o folha.csv

      - name: Instalar browser sem interface
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock --silent playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Ler imoveis do site stopandbuy.pt
        continue-on-error: true
        timeout-minutes: 12
        run: |
          node - << 'EOF'
          // Le todos os imoveis publicados em www.stopandbuy.pt (sitemap -> cada ficha num browser
          // sem interface). A referencia, o concelho e o estado so aparecem depois do JavaScript da
          // pagina correr; o preco, o titulo e o tipo de negocio vem do JSON-LD da propria ficha.
          // Bloqueia imagens e scripts de terceiros (o widget do GHL criaria sessoes falsas na conta).
          const { chromium } = require('playwright');
          const fs = require('fs');
          const UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';
          (async () => {
            // O sitemap ja veio vazio uma vez (30/10, pedido isolado): tenta ate 3 vezes.
            let urls = [];
            for (let tent = 1; tent <= 3 && urls.length === 0; tent++) {
              try {
                const r = await fetch('https://www.stopandbuy.pt/sitemap-pt-pt.xml', { headers: { 'User-Agent': UA } });
                const sm = await r.text();
                urls = [...new Set([...sm.matchAll(/<loc>(https:\/\/www\.stopandbuy\.pt\/imovel\/[^<]+)<\/loc>/g)].map(m => m[1].trim()))];
                console.log('sitemap, tentativa', tent, '- HTTP', r.status, '-', urls.length, 'fichas');
              } catch (e) { console.log('sitemap, tentativa', tent, '- erro', e.message); }
              if (urls.length === 0) await new Promise(res => setTimeout(res, 20000));
            }
            const b = await chromium.launch();
            const ctx = await b.newContext({ userAgent: UA, locale: 'pt-PT' });
            await ctx.route('**/*', r => {
              const u = r.request().url(), t = r.request().resourceType();
              const terceiros = /leadconnector|msgsndr|google|gstatic|facebook|doubleclick|hotjar|clarity|youtube|vimeo/.test(u);
              return (['image', 'font', 'media'].includes(t) || terceiros) ? r.abort() : r.continue();
            });
            const out = [];
            let i = 0;
            async function ler(p, u) {
              await p.goto(u, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await p.waitForFunction(() => /Refer[eê]ncia/.test(document.body.innerText), null, { timeout: 25000 });
              return await p.evaluate(() => {
                const t = document.body.innerText;
                const i0 = t.search(/DETALHES DO IM[OÓ]VEL/i);
                let det = i0 >= 0 ? t.slice(i0) : t;
                const j = det.search(/CARACTER[IÍ]STICAS DO IM[OÓ]VEL|LOCALIZA[CÇ][AÃ]O DO IM[OÓ]VEL|PEDIDO DE CONTACTO/i);
                if (j > 0) det = det.slice(0, j);
                const campo = n => { const m = det.match(new RegExp(n + '[ \\t]*\\n?[ \\t]*([^\\n]+)')); return m ? m[1].trim() : ''; };
                let ld = {};
                for (const s of document.querySelectorAll('script[type="application/ld+json"]')) {
                  try { const d = JSON.parse(s.textContent); if (d['@type'] === 'RealEstateListing') ld = d; } catch (e) {}
                }
                const of = ld.offers || {};
                // Tipo de negocio: 1) linha de preco nos detalhes ("Venda 950 000 €"), 2) etiqueta
                // "ARRENDAMENTO SOB CONSULTA" quando nao ha preco, 3) JSON-LD, 4) Venda por omissao.
                const mDet = det.match(/(?:^|\n)\s*(Venda|Arrendamento)\b[ \t]*\n?[ \t]*[\d.\s\u00a0]+€/i);
                const mSob = t.match(/\b(VENDA|ARRENDAMENTO)\s+SOB\s+CONSULTA\b/i);
                const neg = mDet ? (/^arr/i.test(mDet[1]) ? 'Arrendamento' : 'Venda')
                          : mSob ? (/^arr/i.test(mSob[1]) ? 'Arrendamento' : 'Venda')
                          : /Lease|Rent/i.test(of.businessFunction || '') ? 'Arrendamento' : 'Venda';
                return {
                  ref: campo('Refer[eê]ncia'), distrito: campo('Distrito'), concelho: campo('Concelho'),
                  freguesia: campo('Freguesia'), estado: campo('Estado'), natureza: campo('Natureza'),
                  tipologia: campo('Tipologia'), titulo: ld.name || document.title, preco: Number(of.price) || 0,
                  negocio: neg, lat: (ld.about || {}).latitude || '', lng: (ld.about || {}).longitude || ''
                };
              });
            }
            async function worker() {
              const p = await ctx.newPage();
              while (i < urls.length) {
                const u = urls[i++];
                const id = (u.match(/\/(\d+)\/?$/) || [])[1] || '';
                let r = null, erro = '';
                for (let tent = 0; tent < 2 && !r; tent++) {
                  try { r = await ler(p, u); } catch (e) { erro = String(e.message || e).slice(0, 120); }
                }
                out.push(r ? { url: u, id, ok: true, ...r } : { url: u, id, ok: false, erro });
              }
              await p.close();
            }
            await Promise.all([worker(), worker(), worker()]);
            await b.close();
            fs.writeFileSync('site.json', JSON.stringify(out, null, 1));
            console.log('lidas:', out.filter(x => x.ok).length, '| com referencia:', out.filter(x => x.ok && x.ref).length, '| erros:', out.filter(x => !x.ok).length);
          })().catch(e => { console.error('falhou:', e); process.exit(1); });
          EOF

      - name: Base de dados e escolha da fonte
        run: |
          python3 << 'EOF'
          # Junta a leitura do site a base de dados (dados/imoveis.json), decide a fonte e escreve
          # properties.csv no MESMO formato da folha, para o gerador seguinte nao mudar.
          # Travoes: se a leitura do site vier fraca, usa a folha (backup) e nao mexe na base.
          import csv, html, json, os, shutil
          from datetime import datetime
          from zoneinfo import ZoneInfo

          agora = datetime.now(ZoneInfo("Europe/Lisbon"))
          hoje, hora = agora.strftime("%Y-%m-%d"), agora.strftime("%Y-%m-%d %H:%M")
          CAB = ["Property #", "Reference", "Title", "Location", "Price", "Type", "URL"]

          site, motivo = [], ""
          try:
              with open("site.json", encoding="utf-8") as f:
                  site = json.load(f)
          except Exception as ex:
              motivo = "a leitura do site nao produziu resultado (" + ex.__class__.__name__ + ")"
          ant = {}
          if os.path.exists("dados/imoveis.json"):
              with open("dados/imoveis.json", encoding="utf-8") as f:
                  ant = json.load(f)

          lidos = [p for p in site if p.get("ok")]
          com_ref = [p for p in lidos if (p.get("ref") or "").strip()]
          vendas = [p for p in com_ref if p.get("negocio") == "Venda"]
          n_ant = ant.get("total_venda") or 0
          if not motivo:
              if len(site) < 20:
                  motivo = f"o sitemap do site so trouxe {len(site)} imoveis"
              elif len(com_ref) < 0.9 * len(site):
                  motivo = f"so {len(com_ref)} de {len(site)} fichas lidas com referencia"
              elif n_ant and len(vendas) < 0.7 * n_ant:
                  motivo = f"os imoveis a venda cairam de {n_ant} para {len(vendas)} numa leitura"


          def aviso_do_dia(linhas):
              # alteracoes_hoje.txt: o que mudou no dia (hora de Lisboa), acumulado entre corridas.
              atual = []
              if os.path.exists("alteracoes_hoje.txt"):
                  with open("alteracoes_hoje.txt", encoding="utf-8") as f:
                      atual = f.read().splitlines()
              if not atual or atual[0] != "Data: " + hoje:
                  atual = ["Data: " + hoje]
              atual += linhas
              with open("alteracoes_hoje.txt", "w", encoding="utf-8") as f:
                  f.write("\n".join(atual) + "\n")


          if motivo:
              shutil.copy("folha.csv", "properties.csv")
              with open("fonte.txt", "w", encoding="utf-8") as f:
                  f.write("folha (backup)")
              aviso_do_dia([f"{hora} · LEITURA DO SITE FALHOU · {motivo} · lista gerada a partir da folha"])
              print("FONTE: folha (backup) -", motivo)
              raise SystemExit(0)


          def eur(n):
              return f"{int(n):,}".replace(",", " ") + " €" if n else ""


          # Referencias repetidas no site (ex.: PT03I-0682 tem 3 apartamentos): _A, _B, _C por id
          # decrescente, igual ao que a folha usava, para as fichas manterem o mesmo endereco.
          por_ref = {}
          for p in vendas:
              por_ref.setdefault(p["ref"].strip(), []).append(p)
          for ref, grupo in por_ref.items():
              if len(grupo) > 1:
                  for k, p in enumerate(sorted(grupo, key=lambda x: int(x["id"] or 0), reverse=True)):
                      p["ref_lista"] = f"{ref}_{chr(65 + k)}"

          linhas_csv = []
          for n, p in enumerate(sorted(vendas, key=lambda x: int(x["id"] or 0)), 1):
              titulo = html.unescape(p.get("titulo") or "").strip()
              if (p.get("estado") or "").lower() == "reservado":
                  titulo += " (reservado)"
              conc, freg = (p.get("concelho") or "").strip(), (p.get("freguesia") or "").strip()
              local = f"{conc} > {freg}" if conc and freg else (freg or conc or (p.get("distrito") or "").strip() or "Portugal")
              linhas_csv.append([str(n), p.get("ref_lista") or p["ref"].strip(), titulo, local,
                                 eur(p.get("preco")), "Venda", p["url"]])
          # Ficha no site sem referencia: vai como linha sem Reference -> ignoradas.txt (aviso M-042)
          for p in lidos:
              if not (p.get("ref") or "").strip() and p.get("negocio") == "Venda":
                  linhas_csv.append(["", "", html.unescape(p.get("titulo") or ""), p.get("concelho") or "",
                                     eur(p.get("preco")), "Venda", p["url"]])

          with open("properties.csv", "w", encoding="utf-8", newline="") as f:
              w = csv.writer(f)
              w.writerow(CAB)
              w.writerows(linhas_csv)
          # folha.json: o que o Make escreve na folha (backup), igual ao properties.csv. E um
          # ValueRange da API do Google Sheets, enviado tal e qual (sem campos a mais).
          with open("folha.json", "w", encoding="utf-8") as f:
              # So linhas completas: a tabela do GHL (sincronizada desta folha) recusa a sincronizacao
              # INTEIRA se uma linha tiver Reference, Title ou Location vazios (visto a 02/11/2026).
              completas = [l for l in linhas_csv if l[1] and l[2] and l[3]]
              json.dump({"majorDimension": "ROWS", "values": [CAB] + completas}, f, ensure_ascii=False)
          with open("fonte.txt", "w", encoding="utf-8") as f:
              f.write("site stopandbuy.pt")

          # Base de dados: todos os imoveis lidos (venda e arrendamento), com a data em que apareceram.
          ant_im = ant.get("imoveis", {})
          novo_im = {}
          for p in com_ref:
              reg = {k: p.get(k, "") for k in ("ref", "titulo", "negocio", "preco", "estado", "natureza",
                                                "tipologia", "distrito", "concelho", "freguesia", "url")}
              reg["titulo"] = html.unescape(reg["titulo"] or "")
              reg["primeira_vez"] = ant_im.get(p["id"], {}).get("primeira_vez", hora)
              reg["ultima_vez"] = hora
              novo_im[p["id"]] = reg

          mud = []
          if ant_im:
              def desc(r):
                  return f"{r['ref']} · {r['titulo']} · {eur(r['preco']) or 'sob consulta'} · {r['negocio']} · {r['url']}"
              for i, r in novo_im.items():
                  a = ant_im.get(i)
                  if not a:
                      mud.append(f"{hora} · NOVO · {desc(r)}")
                      continue
                  if a.get("preco") != r["preco"]:
                      mud.append(f"{hora} · PREÇO {eur(a.get('preco')) or 'sob consulta'} → {eur(r['preco']) or 'sob consulta'} · {desc(r)}")
                  if (a.get("estado") or "") != (r["estado"] or ""):
                      mud.append(f"{hora} · ESTADO {a.get('estado') or '—'} → {r['estado'] or '—'} · {desc(r)}")
                  if a.get("ref") != r["ref"]:
                      mud.append(f"{hora} · REFERÊNCIA {a.get('ref')} → {r['ref']} · {desc(r)}")
              for i, a in ant_im.items():
                  if i not in novo_im:
                      mud.append(f"{hora} · RETIRADO DO SITE · {desc(a)}")
          else:
              mud.append(f"{hora} · PRIMEIRA LEITURA DO SITE · {len(vendas)} à venda, {len(com_ref) - len(vendas)} para arrendar")
          if mud:
              aviso_do_dia(mud)

          os.makedirs("dados", exist_ok=True)
          with open("dados/imoveis.json", "w", encoding="utf-8") as f:
              json.dump({"atualizado": hora, "fonte": "site stopandbuy.pt", "total_venda": len(vendas),
                         "total": len(com_ref), "imoveis": novo_im}, f, ensure_ascii=False, indent=1, sort_keys=True)
          print(f"FONTE: site - {len(vendas)} a venda, {len(com_ref) - len(vendas)} para arrendar, {len(mud)} alteracoes")
          EOF

      - name: Gerar HTML
        run: |
          python3 << 'EOF'
          import csv, html, json, os, re, shutil
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          rows = []
          ignoradas = []   # M-042: linhas com dados mas sem referencia ficam fora da lista
          with open("properties.csv", "r", encoding="utf-8") as f:
              for row in csv.DictReader(f):
                  if (row.get("Reference") or "").strip():
                      rows.append(row)
                  elif any((row.get(k) or "").strip() for k in ("Title", "URL", "Price")):
                      ignoradas.append(row)

          # Hora de Lisboa (o UTC+1 fixo adiantava 1 h no inverno)
          agora = datetime.now(ZoneInfo("Europe/Lisbon"))
          now = agora.strftime("%Y-%m-%d %H:%M")
          hoje = agora.strftime("%Y-%m-%d")
          fonte = open("fonte.txt", encoding="utf-8").read().strip() if os.path.exists("fonte.txt") else "folha"
          # So com a lista lida do site se da um imovel como retirado. Com a folha (backup) as
          # paginas antigas ficam como estao: a folha pode estar atrasada.
          lista_do_site = fonte.startswith("site")


          def ler_antigas(pasta):
              # Paginas publicadas na corrida anterior, lidas ANTES de a pasta ser limpa.
              out = {}
              if os.path.isdir(pasta):
                  for nome in sorted(os.listdir(pasta)):
                      if nome.endswith(".html"):
                          with open(os.path.join(pasta, nome), encoding="utf-8") as f:
                              out[nome] = f.read()
              return out


          def titulo_antigo(doc):
              m = re.search(r"<title>(.*?)\s*\|\s*Stop And Buy</title>", doc, re.S)
              return html.unescape(m.group(1)).strip() if m else ""

          CSS = ("body{font-family:Arial,sans-serif;margin:20px;max-width:820px}"
                 "h1{color:#2c3e50}h2{color:#2c3e50;font-size:1.15em}"
                 ".update{color:#7f8c8d;font-size:.9em;margin-bottom:20px}"
                 ".property{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:5px}"
                 ".property h2{margin:0 0 8px;font-size:1.1em}"
                 ".property p{margin:4px 0;color:#555}"
                 ".ref{font-weight:bold;color:#e67e22}"
                 ".price{font-weight:bold;color:#27ae60;font-size:1.1em}a{color:#2980b9}")

          # pasta limpa para as paginas individuais (as antigas ficam em memoria: ver RETIRADAS)
          antigas_imoveis = ler_antigas("imoveis")
          if os.path.isdir("imoveis"):
              shutil.rmtree("imoveis")
          os.makedirs("imoveis", exist_ok=True)

          def clean_price(p):
              p = (p or "").strip()
              if not p:
                  return "Sob consulta"
              return p if "€" in p else p + " €"

          def clean_local(loc):
              # "Aljustrel > Aljustrel" -> "Aljustrel"; "A > B" -> "B (concelho de A)"
              parts = [x.strip() for x in (loc or "").split(">") if x.strip()]
              if not parts:
                  return ""
              if len(parts) == 1 or parts[0] == parts[-1] or parts[0] in parts[-1]:
                  return parts[-1]
              return f"{parts[-1]}, concelho de {parts[0]}"

          def extrai_area(title):
              # A area vive no titulo do imovel, escrito a mao. So se extrai quando
              # o padrao e inequivoco; caso contrario fica vazio, para o bot dizer
              # que nao tem a informacao em vez de inventar um numero.
              t = title or ""
              m = re.search(r"(\d{1,4}(?:[.,]\d{1,2})?)\s*(?:ha\b|hectares?\b)", t, re.I)
              if m:
                  return m.group(1).replace(".", ",") + " ha"
              m = re.search(r"(\d{1,3}(?:[.\s]?\d{3})*|\d+)\s*(?:m2\b|m\u00b2)", t, re.I)
              if m:
                  return m.group(1).replace(" ", ".") + " m\u00b2"
              return ""

          def extrai_tipologia(title):
              m = re.search(r"\bT\s?(\d)(\s*\+\s*(\d))?\b", title or "", re.I)
              if not m:
                  return ""
              return "T%s+%s" % (m.group(1), m.group(3)) if m.group(3) else "T" + m.group(1)

          # Freguesia/localidade -> concelho. A folha so traz a localidade em muitas linhas,
          # e sem concelho nem regiao a pesquisa por zona ("Costa Alentejana", "perto de
          # Sines") nao encontra nada. Localidade nova sem mapa fica com o concelho vazio.
          CONCELHOS = {
              "santiago do cacém": "Santiago do Cacém",
              "santiago do cacém, s.cruz e s.bartolomeu da serra": "Santiago do Cacém",
              "são francisco da serra": "Santiago do Cacém", "são domingos e vale de água": "Santiago do Cacém",
              "vale de água": "Santiago do Cacém", "cercal": "Santiago do Cacém", "abela": "Santiago do Cacém",
              "santo andré": "Santiago do Cacém", "sines": "Sines", "porto covo": "Sines",
              "são luís": "Odemira", "são teotónio": "Odemira", "colos": "Odemira",
              "vila nova de milfontes": "Odemira", "odemira": "Odemira",
              "grândola e santa margarida da serra": "Grândola", "grândola": "Grândola",
              "ourique": "Ourique", "aljustrel": "Aljustrel", "messejana": "Aljustrel",
              "santa cruz": "Almodôvar", "almodôvar": "Almodôvar",
              "mexilhoeira grande": "Portimão", "portimão": "Portimão",
          }
          LITORAL = "Alentejo Litoral (Costa Alentejana)"
          REGIOES = {
              "Santiago do Cacém": LITORAL, "Sines": LITORAL, "Odemira": LITORAL, "Grândola": LITORAL,
              "Aljustrel": "Baixo Alentejo (interior)", "Ourique": "Baixo Alentejo (interior)",
              "Almodôvar": "Baixo Alentejo (interior)", "Portimão": "Algarve",
          }

          def concelho_regiao(loc):
              parts = [x.strip() for x in (loc or "").split(">") if x.strip()]
              if not parts:
                  return "", ""
              conc = CONCELHOS.get(parts[0].lower(), "") if len(parts) > 1 else ""
              conc = conc or CONCELHOS.get(parts[-1].lower(), "") or (parts[0] if len(parts) > 1 else "")
              return conc, REGIOES.get(conc, "")

          def preco_num(p):
              d = re.sub(r"\D", "", p or "")
              return int(d) if d else None

          def slugify(t):
              t = t.lower()
              for a, b in (("áàâã", "a"), ("éê", "e"), ("í", "i"), ("óôõ", "o"), ("ú", "u"), ("ç", "c")):
                  for ch in a:
                      t = t.replace(ch, b)
              return re.sub(r"[^a-z0-9]+", "-", t).strip("-")

          catalogo = []

          index_cards = []

          for r in rows:
              ref = (r.get("Reference") or "").strip()
              title = (r.get("Title") or "").strip()
              local = clean_local(r.get("Location"))
              price = clean_price(r.get("Price"))
              tipo = (r.get("Type") or "").strip()
              url = (r.get("URL") or "").strip()
              area = extrai_area(title)
              tipol = extrai_tipologia(title)
              conc, reg = concelho_regiao(r.get("Location"))

              slug = re.sub(r"[^A-Za-z0-9-]", "", ref) or "sem-ref"
              tail = ref.split("-")[-1].strip()        # PT03Q-0706 -> 0706 ; PT03I-0682A -> 0682A
              digits = re.sub(r"\D", "", tail)         # 0706
              short = digits.lstrip("0") or digits     # 706

              # variantes de escrita da referencia, sem repeticoes
              variantes, _vistos = [], set()
              for v in (ref, f"ref {ref}", f"referencia {ref}", tail, f"ref {tail}",
                        digits, f"ref {digits}", f"ref. {short}", f"código {ref}", f"imóvel {ref}"):
                  if v and v not in _vistos:
                      _vistos.add(v)
                      variantes.append(v)

              e = html.escape
              extras = []
              if area:
                  extras.append(f"\u00c1rea: {e(area)}")
              if tipol:
                  extras.append(f"Tipologia: {e(tipol)}")
              if conc:
                  extras.append(f"Concelho: {e(conc)}")
              if reg:
                  extras.append(f"Região: {e(reg)}")
              linha_extras = ("<p>" + " \u00b7 ".join(extras) + "</p>") if extras else ""
              # A referencia aparece no title, no h1 e em varias formas no corpo.
              # E o que torna o codigo recuperavel pela pesquisa da knowledge base.
              # A ficha e um REDIRECCIONADOR permanente: a referencia e o URL.
              # O bot nao precisa de procurar nada, so de compor .../imoveis/<REF>.html
              redirect = ""  # NAO repor: o rastreador do GHL seguia-o e indexava o anuncio, nao a ficha
              destino = (f'<p>Link:</p>'
                         f'<p><a href="{e(url)}">{e(url)}</a></p>') if url else (
                         f'<p>O anúncio da referência {e(ref)} não está disponível online neste momento.</p>'
                         f'<p>Contacte a Stop And Buy: (+351) 269 633 106</p>')

              page = f"""<!DOCTYPE html>
          <html lang="pt"><head><meta charset="UTF-8">
          {redirect}
          <title>{e(ref)} - {e(title)} | Stop And Buy</title>
          <meta name="description" content="Imóvel Stop And Buy com a referência {e(ref)}: {e(title)}, {e(local)}. Preço {e(price)}.">
          <style>{CSS}</style>
          </head><body>
          <h1>{e(ref)} - {e(title)}</h1>
          <p>Referência: <span class="ref">{e(ref)}</span> · {e(local)} · <span class="price">{e(price)}</span> · {e(tipo)}</p>
          {linha_extras}
          {destino}
          <hr>
          <p><a href="../index.html">Todos os imóveis Stop And Buy</a></p>
          </body></html>"""

              with open(os.path.join("imoveis", slug + ".html"), "w", encoding="utf-8") as f:
                  f.write(page)

              catalogo.append(dict(ref=ref, title=title, local=local, price=price, num=preco_num(price),
                                   url=url, conc=conc, reg=reg, extras=" · ".join(extras)))

              index_cards.append(
                  f'<div class="property"><h2><a href="imoveis/{e(slug)}.html">{e(ref)} - {e(title)}</a></h2>'
                  f'<p>Ref: <span class="ref">{e(ref)}</span></p>'
                  f'<p>Local: {e(local)}</p>'
                  f'<p>Preço: <span class="price">{e(price)}</span></p>'
                  f'<p>Tipo: {e(tipo)}</p>'
                  + linha_extras +
                  f'<p>Link: <a href="{e(url)}">{e(url)}</a></p>'
                  f'<p>Ficha completa da referência {e(ref)}: '
                  f'<a href="imoveis/{e(slug)}.html">imoveis/{e(slug)}.html</a></p></div>'
              )

          # M-042: as linhas sem referencia vao para ignoradas.txt (lido todos os dias por um
          # cenario Make que avisa o geral@) e o numero aparece no cabecalho do indice.
          linhas_ign = [" · ".join([(r.get("Title") or "").strip() or "(sem titulo)",
                                    clean_price(r.get("Price")),
                                    (r.get("URL") or "").strip() or "(sem link)"]) for r in ignoradas]
          with open("ignoradas.txt", "w", encoding="utf-8") as f:
              f.write("".join(l + "\n" for l in linhas_ign))
          aviso_ign = f" | Linhas da folha sem referência: {len(ignoradas)}" if ignoradas else ""

          # RETIRADAS (C-018, 04/11/2026): a ficha de um imovel que saiu do site NAO e apagada.
          # O GHL nao larga da knowledge base uma pagina que passa a dar 404: fica com o texto antigo
          # e o bot continua a oferecer o imovel. Com a ficha trocada por um aviso, o refresh diario
          # do GHL substitui o texto. A ficha retirada nao entra no indice nem no sitemap; se o imovel
          # voltar ao site, a ficha normal volta a ser escrita por cima.
          MARCA_RETIRADA = "<!-- ficha-retirada -->"
          retiradas_hoje = []
          # Travao: so se retiram fichas com a lista do site E se a lista nao encolheu de repente
          # (menos de 20 imoveis ou menos de 70 % das fichas activas da corrida anterior).
          ativas_antes = sum(1 for d in antigas_imoveis.values() if MARCA_RETIRADA not in d)
          pode_retirar = lista_do_site and len(rows) >= 20 and len(rows) >= 0.7 * ativas_antes
          if lista_do_site and not pode_retirar:
              print(f"AVISO: lista com {len(rows)} imoveis para {ativas_antes} fichas activas - nenhuma ficha retirada")
          for nome, doc in antigas_imoveis.items():
              caminho = os.path.join("imoveis", nome)
              if os.path.exists(caminho):
                  continue                      # o imovel continua (ou voltou) a lista
              if not pode_retirar or MARCA_RETIRADA in doc:
                  with open(caminho, "w", encoding="utf-8") as f:
                      f.write(doc)              # backup da folha, ou aviso ja feito: fica igual
                  continue
              ref_r = nome[:-5]
              antigo = titulo_antigo(doc)
              if antigo.startswith(ref_r + " - "):
                  antigo = antigo[len(ref_r) + 3:]
              e = html.escape
              aviso = f"""<!DOCTYPE html>
          <html lang="pt"><head><meta charset="UTF-8">
          {MARCA_RETIRADA}
          <meta name="robots" content="noindex">
          <title>{e(ref_r)} - IMÓVEL INDISPONÍVEL (vendido ou retirado) | Stop And Buy</title>
          <style>{CSS}</style>
          </head><body>
          <h1>{e(ref_r)} - IMÓVEL INDISPONÍVEL</h1>
          <p>O imóvel com a referência <span class="ref">{e(ref_r)}</span>{(" (" + e(antigo) + ")") if antigo else ""} já não está à venda na Stop And Buy: foi vendido ou retirado do mercado ({hoje}).</p>
          <p>Não faz parte da lista de imóveis disponíveis: não tem preço, link nem visitas.</p>
          <p><a href="../index.html">Ver os imóveis disponíveis</a></p>
          </body></html>"""
              with open(caminho, "w", encoding="utf-8") as f:
                  f.write(aviso)
              retiradas_hoje.append(ref_r)

          index = f"""<!DOCTYPE html>
          <html lang="pt"><head><meta charset="UTF-8">
          <title>Stop And Buy - Imóveis Disponíveis</title>
          <style>{CSS}</style>
          </head><body>
          <h1>Stop And Buy - Imóveis Disponíveis</h1>
          <p class="update">Atualizado: {now} | Total: {len(rows)} imóveis{aviso_ign} | Fonte: {fonte}</p>
          <p>Cada imóvel tem uma ficha própria, acessível pela sua referência.</p>
          {''.join(index_cards)}
          </body></html>"""

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(index)
          # Paginas de PESQUISA por orcamento e por concelho. A pesquisa da knowledge base
          # e por semelhanca e devolve 5 blocos: uma pergunta "300 a 350 mil na Costa
          # Alentejana" nunca encontra as fichas certas uma a uma. Uma pagina pequena por
          # faixa de preco e por concelho da ao bot a lista inteira que responde ao criterio.
          # Faixas SOBREPOSTAS de proposito: um orcamento perto do limite cai em duas.
          antigas_pesquisa = ler_antigas("pesquisa")
          if os.path.isdir("pesquisa"):
              shutil.rmtree("pesquisa")
          os.makedirs("pesquisa", exist_ok=True)
          FAIXAS = [(0, 150000), (100000, 250000), (200000, 350000), (300000, 450000),
                    (400000, 600000), (550000, 1000000), (900000, None)]

          def eur(n):
              return f"{n:,}".replace(",", ".") + " €"

          def linha(c):
              base = f"{c['ref']} — {c['title']} · {c['local']} · {c['price']}"
              if c["extras"]:
                  base += " · " + c["extras"]
              return base + (f" · Link: {c['url']}" if c["url"] else " · sem anúncio online")

          def pagina(nome, titulo, intro, itens):
              e = html.escape
              lis = "".join(f"<li>{e(linha(c))}</li>" for c in itens)
              corpo = (f"<ul>{lis}</ul>" if itens else "<p>Neste momento não há imóveis nesta pesquisa.</p>")
              doc = f"""<!DOCTYPE html>
          <html lang="pt"><head><meta charset="UTF-8">
          <title>{e(titulo)} | Stop And Buy</title>
          <style>{CSS}</style>
          </head><body>
          <h1>{e(titulo)}</h1>
          <p>{e(intro)} Total: {len(itens)} imóveis. Atualizado: {now}.</p>
          {corpo}
          <p><a href="../index.html">Todos os imóveis Stop And Buy</a></p>
          </body></html>"""
              with open(os.path.join("pesquisa", nome), "w", encoding="utf-8") as f:
                  f.write(doc)
              return "pesquisa/" + nome

          com_preco = sorted([c for c in catalogo if c["num"]], key=lambda c: c["num"])
          paginas = []
          for lo, hi in FAIXAS:
              itens = [c for c in com_preco if c["num"] >= lo and (hi is None or c["num"] <= hi)]
              if hi is None:
                  titulo = f"Imóveis à venda acima de {eur(lo)}"
                  intro = f"Imóveis da Stop And Buy para um orçamento acima de {lo // 1000} mil euros, do mais barato para o mais caro."
                  nome = f"preco-acima-de-{lo}.html"
              else:
                  titulo = f"Imóveis à venda entre {eur(lo)} e {eur(hi)}"
                  intro = (f"Imóveis da Stop And Buy para um orçamento entre {lo // 1000} mil e {hi // 1000} mil euros, "
                           f"do mais barato para o mais caro.")
                  nome = f"preco-{lo}-{hi}.html"
              paginas.append(pagina(nome, titulo, intro, itens))

          por_conc = {}
          for c in com_preco:
              if c["conc"]:
                  por_conc.setdefault(c["conc"], []).append(c)
          for conc, itens in sorted(por_conc.items()):
              reg = REGIOES.get(conc, "")
              titulo = f"Imóveis à venda no concelho de {conc}" + (f" — {reg}" if reg else "")
              intro = f"Todos os imóveis da Stop And Buy no concelho de {conc}, do mais barato para o mais caro."
              paginas.append(pagina(f"concelho-{slugify(conc)}.html", titulo, intro, itens))

          # Paginas PERTO DE: um lead que diz "perto de Sines" quer tambem Sao Luis
          # (Odemira) e Vale de Agua (Santiago do Cacem). A pesquisa por semelhanca
          # devolvia so a pagina do concelho de Sines e o bot concluia que nao havia
          # nada. Cada pagina junta o concelho e os concelhos vizinhos, por preco.
          VIZINHOS = {
              "Sines": ["Santiago do Cacém", "Odemira"],
              "Santiago do Cacém": ["Sines", "Grândola", "Odemira", "Ourique", "Aljustrel"],
              "Odemira": ["Sines", "Santiago do Cacém", "Ourique"],
              "Grândola": ["Santiago do Cacém", "Sines"],
              "Ourique": ["Odemira", "Santiago do Cacém", "Aljustrel", "Almodôvar"],
              "Aljustrel": ["Santiago do Cacém", "Ourique"],
              "Almodôvar": ["Ourique"],
          }
          for conc, viz in VIZINHOS.items():
              zona = [conc] + viz
              itens = [c for c in com_preco if c["conc"] in zona]
              if not itens:
                  continue
              locs = sorted({(c["local"] or "").split(",")[0].split(">")[-1].strip()
                             for c in itens if c["conc"] in zona and c["local"]} - {""})
              titulo = f"Imóveis à venda perto de {conc} — {conc} e concelhos vizinhos ({', '.join(viz)})"
              intro = (f"Para quem procura imóveis perto de {conc}, nos arredores de {conc} ou na zona de {conc}: "
                       f"todos os imóveis da Stop And Buy no concelho de {conc} e nos concelhos vizinhos "
                       f"{', '.join(viz)}, do mais barato para o mais caro. Localidades: {', '.join(locs)}.")
              paginas.append(pagina(f"perto-de-{slugify(conc)}.html", titulo, intro, itens))

          litoral = [c for c in com_preco if c["reg"] == LITORAL]
          paginas.append(pagina("regiao-alentejo-litoral.html",
                                f"Imóveis à venda no {LITORAL}",
                                "Imóveis da Stop And Buy nos concelhos de Sines, Santiago do Cacém, Odemira e Grândola "
                                "(Porto Covo, Vila Nova de Milfontes, Santo André, Cercal, São Luís, São Teotónio), "
                                "do mais barato para o mais caro.", litoral))

          # Pesquisas que deixaram de ter imoveis (ex.: concelho-portimao.html a 03/11): pelo mesmo
          # motivo das fichas, a pagina fica, sem imoveis, em vez de dar 404. Fora do sitemap.
          for nome, doc in antigas_pesquisa.items():
              caminho = os.path.join("pesquisa", nome)
              if os.path.exists(caminho):
                  continue
              if not pode_retirar or "Total: 0 imóveis" in doc:
                  with open(caminho, "w", encoding="utf-8") as f:
                      f.write(doc)
                  continue
              pagina(nome, titulo_antigo(doc) or nome[:-5].replace("-", " "),
                     "Neste momento a Stop And Buy não tem imóveis à venda nesta pesquisa.", [])

          # sitemap.xml: lista das paginas ACTIVAS (sem fichas retiradas). Nota 04/11/2026: o
          # rastreador do GHL NAO o usa para descobrir fichas novas (so refresca os URLs que ja
          # tem) - as novas entram pelo kb_novos.txt, mais abaixo.
          BASE = "https://mab-cm-sketch.github.io/ptm-imoveis-kb/"
          urls = [BASE] + [f"{BASE}imoveis/{re.sub(r'[^A-Za-z0-9-]', '', (r.get('Reference') or '').strip()) or 'sem-ref'}.html" for r in rows] + [BASE + p for p in paginas]
          linhas = [f"  <url><loc>{html.escape(u)}</loc><lastmod>{hoje}</lastmod></url>" for u in urls]
          sitemap = chr(10).join(['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'] + linhas + ['</urlset>', ''])
          with open("sitemap.xml", "w", encoding="utf-8") as f:
              f.write(sitemap)

          # kb_novos.txt: paginas publicadas pela 1.a vez, para entrarem na knowledge base do GHL.
          # dados/kb_urls.json guarda todos os URLs ja publicados (activos e retirados). Uma linha
          # por URL novo, "AAAA-MM-DD URL" (dia de Lisboa da corrida que o publicou), ultimos 7 dias.
          # O Make 10074461 corre as 21:30 e acrescenta a KB (API, modo Exact) so as linhas de ONTEM:
          # o dia de ontem ja esta fechado, por isso nenhuma corrida atrasada fica de fora e cada
          # URL e enviado uma unica vez. Na 1.a corrida so regista.
          os.makedirs("dados", exist_ok=True)
          REG = "dados/kb_urls.json"
          publicados = set(urls) | {BASE + "imoveis/" + n for n in os.listdir("imoveis")} \
                       | {BASE + "pesquisa/" + n for n in os.listdir("pesquisa")}
          if os.path.exists(REG):
              with open(REG, encoding="utf-8") as f:
                  conhecidos = set(json.load(f).get("urls", []))
              novos = sorted(u for u in publicados - conhecidos if u != BASE)
          else:
              conhecidos, novos = set(), []
          with open(REG, "w", encoding="utf-8") as f:
              json.dump({"atualizado": now, "urls": sorted(conhecidos | publicados)}, f, ensure_ascii=False, indent=1)
          desde = (agora - timedelta(days=6)).strftime("%Y-%m-%d")
          kb, dia_antigo = [], hoje
          if os.path.exists("kb_novos.txt"):
              with open("kb_novos.txt", encoding="utf-8") as f:
                  for l in f.read().splitlines():
                      l = l.strip()
                      if l.startswith("Data: "):          # formato antigo (um dia por ficheiro)
                          dia_antigo = l[6:16]
                      elif l.startswith("https://"):      # formato antigo: URL sem data
                          kb.append((dia_antigo, l))
                      elif re.match(r"\d{4}-\d{2}-\d{2} https://", l):
                          d, u = l.split(" ", 1)
                          kb.append((d, u.strip()))
          ja = {u for _, u in kb}
          kb += [(hoje, u) for u in novos if u not in ja]
          kb = [(d, u) for d, u in kb if d >= desde]
          with open("kb_novos.txt", "w", encoding="utf-8") as f:
              f.write(f"# Paginas novas para a knowledge base (ultimos 7 dias) | Atualizado: {now}\n")
              f.write("".join(f"{d} {u}\n" for d, u in kb))

          # 404: uma referencia que nao exista aterra aqui, em vez de dar erro cru
          nao_encontrado = f"""<!DOCTYPE html>
          <html lang="pt"><head><meta charset="UTF-8">
          <title>Referência não encontrada | Stop And Buy</title>
          <style>{CSS}</style>
          </head><body>
          <h1>Referência não encontrada</h1>
          <p>Não encontrámos nenhum imóvel com essa referência na lista da Stop And Buy.
          Pode ter havido um erro no código, ou o imóvel pode ter saído do mercado.</p>
          <p>Contacte-nos: (+351) 269 633 106 · <a href="https://www.stopandbuy.pt">stopandbuy.pt</a></p>
          <p><a href="/ptm-imoveis-kb/index.html">Ver todos os imóveis disponíveis</a></p>
          </body></html>"""
          with open("404.html", "w", encoding="utf-8") as f:
              f.write(nao_encontrado)

          print(f"Gerado index.html + 404.html + {len(rows)} fichas em imoveis/ + {len(paginas)} paginas em pesquisa/"
                f" | fichas retiradas nesta corrida: {', '.join(retiradas_hoje) or 'nenhuma'}"
                f" | URLs novos para a KB: {len(novos)}")
          EOF

      - name: Commit e push
        id: commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A index.html 404.html imoveis pesquisa sitemap.xml ignoradas.txt dados folha.json alteracoes_hoje.txt kb_novos.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update imóveis $(date '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
