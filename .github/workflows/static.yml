# Deploy manual do conteudo estatico para o GitHub Pages.
#
# ATENCAO: este workflow NAO corre em push, de proposito.
# O deploy automatico e feito pelo workflow "Atualizar lista de imoveis"
# (update-imoveis.yml), que gera as fichas E publica no mesmo run.
# Quando os dois disparavam ao mesmo tempo, colidiam no grupo de concorrencia
# "pages" e um deles morria com "Deployment cancelled" (06/08/2026).
# Este fica so como recurso manual.
name: Deploy static content to Pages

on:
  # Apenas manual, a partir do separador Actions.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
